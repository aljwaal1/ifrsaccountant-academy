<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46E4EF"/>
      <stop offset="0.48" stop-color="#169FDB"/>
      <stop offset="1" stop-color="#1765D8"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#124B91"/>
      <stop offset="1" stop-color="#082C67"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF39A"/>
      <stop offset="0.45" stop-color="#FFD447"/>
      <stop offset="1" stop-color="#EAA91C"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF4FF"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#003366" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)"/>
  <circle cx="258" cy="244" r="195" fill="#FFFFFF" opacity="0.94"/>

  <g filter="url(#shadow)">
    <!-- growth chart -->
    <rect x="342" y="246" width="24" height="88" rx="8" fill="#31C8B7"/>
    <rect x="377" y="215" width="24" height="119" rx="8" fill="#25BBAA"/>
    <rect x="412" y="171" width="24" height="163" rx="8" fill="#19AA9D"/>
    <path d="M325 229 C359 216 393 190 424 150" fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round"/>
    <path d="M413 151 L447 137 L439 174 Z" fill="#F4BE2D"/>

    <!-- graduation cap -->
    <path d="M145 141 L255 90 L365 141 L255 191 Z" fill="url(#navy)"/>
    <path d="M189 160 C223 181 288 181 322 160 V198 C291 224 218 224 189 198 Z" fill="#0D3F7D"/>
    <path d="M154 148 V208" stroke="#F0B625" stroke-width="9" stroke-linecap="round"/>
    <circle cx="154" cy="210" r="9" fill="#FFD44A"/>
    <path d="M154 219 L142 252 H166 Z" fill="url(#gold)"/>

    <!-- calculator -->
    <rect x="178" y="170" width="164" height="205" rx="30" fill="url(#navy)" stroke="#5CDDED" stroke-width="5"/>
    <rect x="201" y="192" width="118" height="42" rx="11" fill="#BFF7F1" stroke="#7FE0DE" stroke-width="4"/>
    <g fill="#F7FBFF">
      <rect x="202" y="254" width="31" height="31" rx="8"/>
      <rect x="244" y="254" width="31" height="31" rx="8"/>
      <rect x="286" y="254" width="31" height="31" rx="8"/>
      <rect x="202" y="295" width="31" height="31" rx="8"/>
      <rect x="244" y="295" width="31" height="31" rx="8"/>
      <rect x="286" y="295" width="31" height="31" rx="8"/>
    </g>
    <rect x="286" y="336" width="31" height="31" rx="8" fill="url(#gold)"/>
    <path d="M301.5 344 V359 M294 351.5 H309" stroke="#12457E" stroke-width="5" stroke-linecap="round"/>

    <!-- open book -->
    <path d="M88 315 C139 290 194 296 256 337 V430 C199 392 145 382 91 397 Z" fill="url(#paper)" stroke="#D8E8F6" stroke-width="4"/>
    <path d="M424 315 C373 290 318 296 256 337 V430 C313 392 367 382 421 397 Z" fill="url(#paper)" stroke="#D8E8F6" stroke-width="4"/>
    <path d="M91 397 C148 383 201 392 256 430 C311 392 365 383 421 397" fill="none" stroke="#F5BD32" stroke-width="11" stroke-linecap="round"/>
    <path d="M256 337 V430" stroke="#C9DCEB" stroke-width="4"/>
  </g>
</svg>