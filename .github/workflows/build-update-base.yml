name: Build Update Base

on:
  workflow_dispatch:
  push:
    branches: [ux-onboarding-ads-2026-09-02]
    paths: ['.github/workflows/build-update-base.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-onboarding-ads-2026-09-02
      - run: python3 scripts/fix_startup_for_update.py
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart pubspec.yaml
          git diff --cached --quiet || (git commit -m "Fix startup crash and bump version" && git push)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
      - run: flutter create --platforms=android --org com.explapp --no-pub .
      - name: Configure Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('android/app/src/main/AndroidManifest.xml')
          s=m.read_text()
          s=s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">','<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />')
          s=s.replace('</application>','        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n    </application>')
          m.write_text(s)
          g=Path('android/app/build.gradle.kts')
          x=g.read_text().replace('applicationId = "com.explapp.accountant_academy_dynamic"','applicationId = "com.explapp.accountantacademy"')
          x=x.replace('signingConfig = signingConfigs.getByName("debug")','')
          g.write_text(x)
          PY
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: accountant-academy-update-base
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 1
