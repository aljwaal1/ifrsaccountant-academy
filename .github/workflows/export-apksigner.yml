name: Export apksigner

on:
  workflow_dispatch:
  push:
    branches: [ux-onboarding-ads-2026-09-02]
    paths: ['.github/workflows/export-apksigner.yml']

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package apksigner
        shell: bash
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p out
          cp "$BT/apksigner" out/
          cp -r "$BT/lib" out/
      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-tool
          path: out
          retention-days: 1
