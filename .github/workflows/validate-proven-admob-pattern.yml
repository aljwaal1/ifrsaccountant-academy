name: Build Signed Academy Release

on:
  workflow_dispatch:
  push:
    branches:
      - ux-onboarding-ads-2026-09-02
    paths:
      - 'scripts/apply_proven_admob_pattern.py'
      - 'lib/ad_service.dart'
      - 'assets/app_icon_final.svg'
      - 'pubspec.yaml'
      - '.github/workflows/validate-proven-admob-pattern.yml'

permissions:
  contents: read

jobs:
  build-signed-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-onboarding-ads-2026-09-02

      - name: Apply proven Matching AdMob pattern
        run: python3 scripts/apply_proven_admob_pattern.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.explapp --no-pub .

      - name: Configure Android exactly like proven app
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          g = gradle.read_text()
          g = g.replace('applicationId = "com.explapp.accountant_academy_dynamic"', 'applicationId = "com.explapp.accountantacademy"')
          g = g.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
          g = g.replace('signingConfig = signingConfigs.getByName("debug")', '')
          if 'androidx.work:work-runtime:2.11.2' not in g:
              g += '\n\ndependencies {\n    implementation("androidx.work:work-runtime:2.11.2")\n}\n'
          gradle.write_text(g)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          if 'android.permission.INTERNET' not in m:
              m = m.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />', 1)
          if 'com.google.android.gms.ads.APPLICATION_ID' not in m:
              m = m.replace('</application>', '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n    </application>', 1)
          manifest.write_text(m)
          PY

      - name: Install final professional launcher icon
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          test -s assets/app_icon_final.svg
          declare -A sizes=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dir="android/app/src/main/res/mipmap-${density}"
            mkdir -p "$dir"
            rm -f "$dir/ic_launcher.png" "$dir/ic_launcher_round.png" "$dir/ic_launcher.webp" "$dir/ic_launcher_round.webp"
            rsvg-convert -w "${sizes[$density]}" -h "${sizes[$density]}" assets/app_icon_final.svg -o "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            file "$dir/ic_launcher.png"
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Get packages
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Verify WorkManager pin
        working-directory: android
        run: |
          ./gradlew app:dependencyInsight --dependency androidx.work:work-runtime --configuration releaseRuntimeClasspath | tee /tmp/workmanager.txt
          grep -q 'androidx.work:work-runtime:2.11.2' /tmp/workmanager.txt

      - name: Validate signing secrets and restore upload key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/accountant-academy-upload-key.jks
          test -s /tmp/accountant-academy-upload-key.jks
          keytool -list -keystore /tmp/accountant-academy-upload-key.jks -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo 'Signing key restored and alias verified.'

      - name: Build release APK and AAB
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew app:assembleRelease app:bundleRelease
          find ../build -type f \( -name '*.apk' -o -name '*.aab' \) -print

      - name: Sign APK and AAB with permanent upload key
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p output
          APK=$(find build -type f -name '*release*.apk' | head -1)
          AAB=$(find build -type f -name '*release*.aab' | head -1)
          test -n "$APK"
          test -n "$AAB"

          cp "$APK" output/accountant-academy-v1.0.7-signed.apk
          cp "$AAB" output/accountant-academy-v1.0.7-signed.aab

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"

          "$APKSIGNER" sign \
            --ks /tmp/accountant-academy-upload-key.jks \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            output/accountant-academy-v1.0.7-signed.apk

          jarsigner \
            -keystore /tmp/accountant-academy-upload-key.jks \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            output/accountant-academy-v1.0.7-signed.aab \
            "$ANDROID_KEY_ALIAS"

      - name: Verify final signatures
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs output/accountant-academy-v1.0.7-signed.apk | tee output/apk-signature-verification.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' output/apk-signature-verification.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' output/apk-signature-verification.txt
          jarsigner -verify -strict -certs output/accountant-academy-v1.0.7-signed.aab > output/aab-signature-verification.txt
          sha256sum output/accountant-academy-v1.0.7-signed.apk output/accountant-academy-v1.0.7-signed.aab | tee output/SHA256SUMS.txt
          echo 'APK v2/v3 signature verified and AAB signature verified.'

      - name: Remove restored private key
        if: always()
        run: rm -f /tmp/accountant-academy-upload-key.jks

      - uses: actions/upload-artifact@v4
        with:
          name: accountant-academy-v1.0.7-signed-release
          path: output/*
          retention-days: 7
