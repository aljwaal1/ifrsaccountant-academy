name: Generate Real Android Store Screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - play-release-prep-2026-08-17
    paths:
      - '.github/workflows/generate-android-store-screenshots.yml'

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Create Android project
        run: flutter create --platforms=android --org com.explapp --no-pub .

      - name: Get packages
        run: flutter pub get

      - name: Configure screenshot APK
        shell: bash
        run: |
          set -euo pipefail
          cat > android/app/src/main/AndroidManifest.xml <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="أكاديمية المحاسب" android:name="${applicationName}" android:icon="@mipmap/ic_launcher" android:usesCleartextTraffic="false" android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:taskAffinity="" android:theme="@style/LaunchTheme" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode" android:hardwareAccelerated="true" android:windowSoftInputMode="adjustResize">
                      <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          MANIFEST
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "launcher_icons/mipmap-${density}/ic_launcher.png" "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp "launcher_icons/mipmap-${density}/ic_launcher_round.png" "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          python3 <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          if p.exists():
              s=p.read_text().replace('applicationId = "com.explapp.accountant_academy_dynamic"','applicationId = "com.explapp.accountantacademy"').replace('minSdk = flutter.minSdkVersion','minSdk = 23')
          else:
              p=Path('android/app/build.gradle')
              s=p.read_text().replace('applicationId "com.explapp.accountant_academy_dynamic"','applicationId "com.explapp.accountantacademy"').replace('minSdkVersion flutter.minSdkVersion','minSdkVersion 23')
          p.write_text(s)
          PY

      - name: Build screenshot APK
        run: flutter build apk --debug

      - name: Capture screenshots on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot-save
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            mkdir -p android_store_screenshots/phone android_store_screenshots/tablet_7 android_store_screenshots/tablet_10
            launch_app(){ adb shell am force-stop com.explapp.accountantacademy; adb shell monkey -p com.explapp.accountantacademy -c android.intent.category.LAUNCHER 1 >/dev/null; sleep 3; }
            shot(){ adb exec-out screencap -p > "$1"; }
            capture_set(){
              folder="$1"; width="$2"; height="$3"; density="$4"; scale="$5"
              adb shell wm size "${width}x${height}"; adb shell wm density "$density"; sleep 2
              launch_app; shot "android_store_screenshots/${folder}/01_home.png"
              adb shell input tap $((width/2)) $((520*scale)); sleep 2; shot "android_store_screenshots/${folder}/02_lessons.png"
              adb shell input tap $((width/2)) $((345*scale)); sleep 2; shot "android_store_screenshots/${folder}/03_lesson_summary.png"
              adb shell input tap $((60*scale)) $((120*scale)); sleep 2; shot "android_store_screenshots/${folder}/04_quiz.png"
              if [ "$folder" = phone ]; then
                adb shell input keyevent 4; sleep 1; adb shell input keyevent 4; sleep 2
                adb shell input tap $((width/2)) $((height-80*scale)); sleep 2; shot "android_store_screenshots/${folder}/05_updates.png"
                adb shell input tap $((60*scale)) $((height-80*scale)); sleep 2; shot "android_store_screenshots/${folder}/06_developer.png"
              fi
            }
            capture_set phone 1080 1920 480 3
            capture_set tablet_7 1440 2560 320 2
            capture_set tablet_10 1800 3200 320 2
            adb shell wm size reset; adb shell wm density reset

      - name: Upload real Android screenshots
        uses: actions/upload-artifact@v4
        with:
          name: accountant-academy-real-android-screenshots
          path: android_store_screenshots
          if-no-files-found: error
          retention-days: 1
