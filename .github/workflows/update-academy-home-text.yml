name: Update academy home text

on:
  push:
    branches:
      - academy-expansion
    paths:
      - scripts/update_academy_home_text.py
      - .github/workflows/update-academy-home-text.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-home-text:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: academy-expansion
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update text
        run: python scripts/update_academy_home_text.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update academy home text"
          git push origin academy-expansion
