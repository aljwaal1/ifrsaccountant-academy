name: Validate UX Onboarding Ads

on:
  workflow_dispatch:
  push:
    branches:
      - ux-onboarding-ads-2026-09-02
    paths:
      - 'scripts/apply_ux_onboarding_ads.py'
      - '.github/workflows/validate-ux-onboarding-ads.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-onboarding-ads-2026-09-02

      - name: Apply UX patch
        run: python3 scripts/apply_ux_onboarding_ads.py

      - name: Commit app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- lib/main.dart pubspec.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Upgrade onboarding developer contact update reminder and ads"
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Create Android project
        run: flutter create --platforms=android --org com.explapp --no-pub .

      - name: Configure Android for test ads
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('<application', '<application android:supportsRtl="true"')
          needle = '</application>'
          meta = '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n    '
          s = s.replace(needle, meta + needle, 1)
          p.write_text(s)
          gradle = Path('android/app/build.gradle.kts')
          if gradle.exists():
              g = gradle.read_text().replace('applicationId = "com.explapp.accountant_academy_dynamic"', 'applicationId = "com.explapp.accountantacademy"')
              gradle.write_text(g)
          PY

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release

      - name: Upload validation APK
        uses: actions/upload-artifact@v4
        with:
          name: accountant-academy-ux-validation-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
