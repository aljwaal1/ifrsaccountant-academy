name: Prepare Academy Expansion

on:
  push:
    branches:
      - academy-expansion
    paths:
      - 'scripts/prepare_academy_expansion.py'
      - '.github/workflows/prepare-academy-expansion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout expansion branch
        uses: actions/checkout@v4
        with:
          ref: academy-expansion
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update application text
        run: python scripts/prepare_academy_expansion.py

      - name: Check Dart formatting
        uses: dart-lang/setup-dart@v1
      - run: dart format --output=none --set-exit-if-changed lib/main.dart || dart format lib/main.dart

      - name: Commit application changes
        run: |
          if git diff --quiet -- lib/main.dart; then
            echo 'No app changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart
          git commit -m 'Prepare app text for expanded accounting academy'
          git push origin academy-expansion
